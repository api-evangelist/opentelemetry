apis:
- aid: opentelemetry:opentelemetry-protocol-otlp-grpc-api
  name: OpenTelemetry Protocol (OTLP) gRPC API
  description: >-
    The OTLP gRPC API defines Protocol Buffers service definitions for exporting traces, metrics, and
    logs over gRPC. It is the primary transport for OpenTelemetry data between SDK instrumentation, the
    OpenTelemetry Collector, and observability backends, offering bidirectional streaming and efficient
    binary encoding.
  humanURL: https://opentelemetry.io/docs/specs/otlp/#otlpgrpc
  tags:
  - gRPC
  - Logging
  - Metrics
  - Observability
  - Tracing
  properties:
  - type: Documentation
    url: https://opentelemetry.io/docs/specs/otlp/#otlpgrpc
  - type: Reference
    url: https://opentelemetry.io/docs/specs/otlp/#otlpgrpc-response
  - type: GitHubRepository
    url: https://github.com/open-telemetry/opentelemetry-proto
- aid: opentelemetry:opentelemetry-collector-api
  name: OpenTelemetry Collector API
  description: >-
    The OpenTelemetry Collector is a vendor-agnostic proxy for receiving, processing, and exporting telemetry
    data. It exposes HTTP and gRPC endpoints for receiving OTLP data and provides a configuration API
    for managing pipelines, receivers, processors, and exporters at runtime via the zPages diagnostic
    extension and config file hot-reloading.
  humanURL: https://opentelemetry.io/docs/collector/
  tags:
  - Collector
  - Configuration
  - Observability
  - Pipeline
  properties:
  - type: Documentation
    url: https://opentelemetry.io/docs/collector/
  - type: Reference
    url: https://opentelemetry.io/docs/collector/configuration/
  - type: GitHubRepository
    url: https://github.com/open-telemetry/opentelemetry-collector
- aid: opentelemetry:opentelemetry-sdk-api
  name: OpenTelemetry SDK API
  description: >-
    The OpenTelemetry SDK API specifies language-level interfaces for instrumentation, including the Tracer,
    Meter, and Logger APIs used by application code to create spans, record metrics, and emit log records.
    Implementations are available for all major programming languages including Java, Python, Go, JavaScript,
    .NET, Ruby, and others.
  humanURL: https://opentelemetry.io/docs/specs/otel/
  tags:
  - Instrumentation
  - Logging
  - Metrics
  - SDK
  - Tracing
  properties:
  - type: Documentation
    url: https://opentelemetry.io/docs/specs/otel/
